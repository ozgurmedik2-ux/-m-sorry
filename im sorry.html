<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    /* Reset and pastel pink aesthetic variables */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-1: #fff4f8;
      --bg-2: #ffe8f0;
      --bg-3: #ffdbe7;
      --card-bg: rgba(255, 255, 255, 0.88);
      --text-main: #3b1625;
      --text-muted: #7a465b;
      --accent-1: #ff5c8a;
      --accent-2: #ff2e63;
      --accent-dark: #d92654;
      --no-bg: #f6e8ee;
      --no-text: #6e4455;
      --shadow: 0 22px 55px rgba(214, 51, 108, 0.14);
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.95) 0%, transparent 50%),
        radial-gradient(circle at 82% 80%, rgba(255, 138, 174, 0.22) 0%, transparent 55%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Gentle floating background hearts layer */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-heart {
      position: absolute;
      bottom: -50px;
      user-select: none;
      will-change: transform, opacity;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 3px 8px rgba(255, 77, 121, 0.12));
    }

    @keyframes floatUp {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(0.9);
        opacity: 0;
      }
      15% {
        opacity: var(--max-op, 0.26);
      }
      50% {
        transform: translate3d(var(--sway, 14px), -54vh, 0) rotate(10deg) scale(1);
      }
      85% {
        opacity: var(--max-op, 0.26);
      }
      100% {
        transform: translate3d(calc(var(--sway, 14px) * -0.7), -112vh, 0) rotate(-10deg) scale(1.05);
        opacity: 0;
      }
    }

    /* Centered frosted glass card */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.94);
      border-radius: 30px;
      padding: 40px 26px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: cardEntrance 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(255, 77, 121, 0.1);
      border: 1px solid rgba(255, 77, 121, 0.18);
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    /* Gentle pulse for hero heart */
    .hero-heart {
      font-size: 54px;
      line-height: 1;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulseHeart 2.4s ease-in-out infinite;
      user-select: none;
    }

    @keyframes pulseHeart {
      0%, 100% {
        transform: scale(1) rotate(-1.5deg);
      }
      50% {
        transform: scale(1.08) rotate(2deg);
      }
    }

    h1 {
      font-size: clamp(22px, 5.2vw, 29px);
      line-height: 1.32;
      font-weight: 700;
      margin-bottom: 28px;
      color: var(--text-main);
    }

    /* Side-by-side interactive buttons container */
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      min-height: 115px;
      position: relative;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      border-radius: 18px;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* "Да" (Yes) button with spring pop and tilt */
    #yesBtn {
      position: relative;
      z-index: 3;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #ffffff;
      padding: 15px 32px;
      font-size: 18px;
      box-shadow: 0 12px 26px rgba(255, 46, 99, 0.3);
      transition:
        transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
        font-size 0.32s ease,
        padding 0.32s ease,
        box-shadow 0.3s ease;
    }

    #yesBtn:hover {
      box-shadow: 0 15px 32px rgba(255, 46, 99, 0.4);
    }

    #yesBtn.spring-pop {
      animation: yesSpring 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes yesSpring {
      0% {
        transform: scale(calc(var(--yes-scale, 1) * 0.9)) rotate(calc(var(--yes-tilt, 0deg) * -0.7));
      }
      55% {
        transform: scale(calc(var(--yes-scale, 1) * 1.1)) rotate(calc(var(--yes-tilt, 0deg) * 1.2));
      }
      100% {
        transform: scale(var(--yes-scale, 1)) rotate(var(--yes-tilt, 0deg));
      }
    }

    /* "Нет" (No) button with shrinking, tilting, and fade-out states */
    #noBtn {
      position: relative;
      z-index: 2;
      background: var(--no-bg);
      color: var(--no-text);
      padding: 14px 26px;
      font-size: 16px;
      box-shadow: 0 8px 18px rgba(110, 68, 85, 0.1);
      transition:
        transform 0.36s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.35s ease,
        background-color 0.25s ease;
    }

    #noBtn:hover {
      background: #eedae2;
    }

    #noBtn.no-wiggle {
      animation: noWiggle 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes noWiggle {
      0% {
        transform: scale(calc(var(--no-scale, 1) * 1.07)) rotate(calc(var(--no-tilt, 0deg) * -1.3));
      }
      60% {
        transform: scale(calc(var(--no-scale, 1) * 0.94)) rotate(calc(var(--no-tilt, 0deg) * 1.2));
      }
      100% {
        transform: scale(var(--no-scale, 1)) rotate(var(--no-tilt, 0deg));
      }
    }

    #noBtn.vanish {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(0.15) rotate(-22deg) !important;
    }

    /* Celebration state */
    .celebration {
      display: none;
      animation: popIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .celebration.active {
      display: block;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .celebration .big-heart {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulseHeart 1.8s ease-in-out infinite;
      user-select: none;
    }

    .celebration h2 {
      font-size: clamp(23px, 5.2vw, 29px);
      line-height: 1.32;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .celebration p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    /* Center burst and gentle rain layers */
    .burst-layer,
    .rain-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .burst-layer {
      z-index: 20;
    }

    .rain-layer {
      z-index: 12;
    }

    .burst-heart {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
      animation: burstFly 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes burstFly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
      }
      75% {
        opacity: 0.95;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25) rotate(var(--rot));
      }
    }

    .rain-heart {
      position: absolute;
      top: -40px;
      will-change: transform, opacity;
      animation: rainFall linear forwards;
    }

    @keyframes rainFall {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: 0.9;
      }
      88% {
        opacity: 0.85;
      }
      100% {
        transform: translate3d(var(--drift, 20px), 108vh, 0) rotate(var(--spin, 35deg));
        opacity: 0;
      }
    }

    @media (max-width: 420px) {
      .card {
        padding: 32px 20px;
        border-radius: 26px;
      }

      .buttons {
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="hearts-bg" id="heartsBg" aria-hidden="true"></div>
  <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>
  <div class="rain-layer" id="rainLayer" aria-hidden="true"></div>

  <main class="card">
    <div id="questionView">
      <div class="badge">💗 Прости меня, пожалуйста</div>
      <div class="hero-heart" aria-hidden="true">🥺💕</div>
      <h1>Извини меня, простишь меня?😖</h1>

      <div class="buttons" id="buttonsBox">
        <button id="yesBtn" type="button">Да</button>
        <button id="noBtn" type="button">Нет</button>
      </div>
    </div>

    <div class="celebration" id="celebrationView">
      <div class="big-heart" aria-hidden="true">💖</div>
      <h2>Спасибо большое! Я так рад! 💖</h2>
      <p>Я это сказал не тебе, правда извини😭💗</p>
    </div>
  </main>

  <script>
    (function () {
      try {
        const heartsBg = document.getElementById("heartsBg");
        const burstLayer = document.getElementById("burstLayer");
        const rainLayer = document.getElementById("rainLayer");
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");
        const questionView = document.getElementById("questionView");
        const celebrationView = document.getElementById("celebrationView");

        // 11 gentle floating background hearts
        const bgSymbols = ["💕", "💗", "💖", "🌸"];
        const bgCount = 11;

        for (let i = 0; i < bgCount; i++) {
          const heart = document.createElement("div");
          heart.className = "bg-heart";
          heart.textContent = bgSymbols[i % bgSymbols.length];

          const opacity = (0.22 + (i % 3) * 0.05).toFixed(2);
          const duration = 12 + (i % 5) * 2.2;
          const sway = (i % 2 === 0 ? 1 : -1) * (12 + (i % 3) * 5);

          heart.style.left = `${(i * 8.8 + 4) % 95}%`;
          heart.style.fontSize = `${16 + (i % 3) * 4}px`;
          heart.style.setProperty("--max-op", opacity);
          heart.style.setProperty("--sway", `${sway}px`);
          heart.style.animationDuration = `${duration}s`;
          heart.style.animationDelay = `${-(i * 1.4)}s`;
          heartsBg.appendChild(heart);
        }

        // 4 sequential stages for the "Нет" button before shrinking and vanishing
        const noPhrases = [
          "Подумай ещё раз",
          "Пожалуйста, прими",
          "Ну пожалуйста...",
          "Дай ещё шанс"
        ];

        const yesTilts = [-3.5, 4.5, -4, 5.5];
        const noTilts = [5, -6.5, 7, -8];
        const noScales = [0.92, 0.84, 0.74, 0.58];

        let noClicks = 0;
        let yesScale = 1;
        let isVanishing = false;

        function replayAnimation(el, className) {
          el.classList.remove(className);
          void el.offsetWidth;
          el.classList.add(className);
        }

        noBtn.addEventListener("click", () => {
          if (isVanishing) return;

          if (noClicks < noPhrases.length) {
            noBtn.textContent = noPhrases[noClicks];

            const currentNoScale = noScales[noClicks] ?? 0.58;
            const currentNoTilt = noTilts[noClicks] ?? 5;
            noBtn.style.setProperty("--no-scale", currentNoScale);
            noBtn.style.setProperty("--no-tilt", `${currentNoTilt}deg`);
            noBtn.style.transform = `scale(${currentNoScale}) rotate(${currentNoTilt}deg)`;
            replayAnimation(noBtn, "no-wiggle");

            yesScale += 0.2;
            const currentYesTilt = yesTilts[noClicks] ?? 3;
            yesBtn.style.setProperty("--yes-scale", yesScale.toFixed(2));
            yesBtn.style.setProperty("--yes-tilt", `${currentYesTilt}deg`);
            yesBtn.style.transform = `scale(${yesScale.toFixed(2)}) rotate(${currentYesTilt}deg)`;
            yesBtn.style.padding = `${15 + noClicks * 2.5}px ${32 + noClicks * 5}px`;
            yesBtn.style.fontSize = `${18 + noClicks * 2}px`;
            replayAnimation(yesBtn, "spring-pop");

            noClicks++;

            if (noClicks === noPhrases.length) {
              isVanishing = true;
              setTimeout(() => {
                noBtn.classList.add("vanish");
                setTimeout(() => {
                  if (noBtn && noBtn.parentNode) {
                    noBtn.remove();
                  }
                }, 380);
              }, 550);
            }
          }
        });

        // Clean 15-heart center burst on "Да"
        function triggerModerateHeartBurst() {
          const burstEmojis = ["❤️", "💖", "💕", "💗", "✨"];
          const count = 15;

          for (let i = 0; i < count; i++) {
            const el = document.createElement("div");
            el.className = "burst-heart";
            el.textContent = burstEmojis[i % burstEmojis.length];

            const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.22;
            const distance = 85 + Math.random() * 125;
            const dx = `${Math.cos(angle) * distance}px`;
            const dy = `${Math.sin(angle) * distance - 20}px`;
            const rot = `${(Math.random() - 0.5) * 90}deg`;

            el.style.setProperty("--dx", dx);
            el.style.setProperty("--dy", dy);
            el.style.setProperty("--rot", rot);
            el.style.fontSize = `${19 + Math.random() * 11}px`;

            burstLayer.appendChild(el);
            setTimeout(() => el.remove(), 1200);
          }
        }

        // Light 22-heart rain over ~2.5 seconds on "Да"
        function triggerGentleHeartRain() {
          const rainEmojis = ["❤️", "💖", "💕", "💗", "✨"];
          const count = 22;

          for (let i = 0; i < count; i++) {
            setTimeout(() => {
              const h = document.createElement("div");
              h.className = "rain-heart";
              h.textContent = rainEmojis[i % rainEmojis.length];
              h.style.left = `${(i * 4.4 + Math.random() * 3) % 96}%`;
              h.style.fontSize = `${16 + (i % 4) * 3}px`;
              h.style.setProperty("--drift", `${(Math.random() - 0.5) * 60}px`);
              h.style.setProperty("--spin", `${(Math.random() - 0.5) * 60}deg`);

              const duration = 2.2 + Math.random() * 0.4;
              h.style.animationDuration = `${duration}s`;
              rainLayer.appendChild(h);

              setTimeout(() => h.remove(), duration * 1000 + 150);
            }, i * 75);
          }
        }

        yesBtn.addEventListener("click", () => {
          questionView.style.display = "none";
          celebrationView.classList.add("active");
          triggerModerateHeartBurst();
          triggerGentleHeartRain();
        });
      } catch (err) {
        console.error("Apology page error:", err);
      }
    })();
  </script>
</body>
</html>
